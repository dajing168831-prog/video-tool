2F百万token |\n||推理服务\\-输出 |5.4元\u002F百万token |\n\n\n&nbsp;\n\n说明：\n\n\n* 文档中“字”都是指字符，字符是指计算机中使用的文字和符号，**1个汉字算1个字符**，英文字母、希腊字母、标点符号、特殊符号、空格、回车等算1个字符；\n\n* 调用字符需要使用UTF\\-8编码，该编码每个汉字通常占三个字节，计费使用字符数，与字节数无关；\n\n* 语音合成标记语言（SSML：Speech Synthesis Markup Language）中的标签按照正常字符进行计费；\n\n* 按时长计费的，累加每次调用的语音时长，精确至秒，最终折算为小时\u002F分钟计费。\n\n* 豆包音频生成模型1.0按模型生成的原始时长计费，倍速不影响计费时长；\n\n* 语音识别相关能力，双声道计费模式，按单声道计费，即**音频时长**进行计费。\n\n* **豆包实时语音大模型按服务用量token计费，该模型token的概念：** \n\n   * 在调用模型推理服务时，会将输入内容转化为模型可以理解的 token ，经过模型处理后，同样输出 token，并转化为您需要的文本或者音频等内容载体。而模型处理（包括输入、输出）的 token 数量会被作为模型推理服务用量的一个重要计量单位；\n\n   * 输入token：包含本轮对话的输入音频、语音合成文本，以及上下文、system prompt、克隆音频等中的音频和文本token；\n\n   * 输出token：包含本轮对话的模型合成的播报音频，音频对应的文本内容，以及语音识别后返回的文本token；\n\n   * 音频和 token 数折算逻辑：输入每1秒的音频大致对应6.25个Token，输出音频每1秒大致对应25个token；\n\n   * 文本token折算类似文本大模型token概念，由于不同模型采用的分词策略不同，同一段文本可能会被转化为不同数量的 token；\n\n   * 文本\u002F音频cached：对于交互中输入的上下文的内容、system prompt等（包含文本及音频内容），如命中了前轮重复输入的部分，则会按照cahed方式计费，计费费率会低于输入，使多轮对话更具成本效益；\n\n   * 由于模型会有动态更新，token折算比例会有变动，实际每轮对话中不同类别准确的 token 用量，以账单计量的token数量为准；\n\n   * 免费额度可以抵扣使用上下文缓存命中缓存的token、未命中缓存的token、输出产生的token；\n\n   * QPM\u002FTPM限制：当前对模型设置了 QPM（Queries Per Minute，每分钟请求数）及 TPM（Tokens Per Minute，每分钟 token 数量）的调用限制，QPM限制为60，TPM限制为100000。\n\n* **豆包语音播客大模型按服务用量token计费，该模型token的概念：** \n\n   * 输入\\-文本token：输入文本字符数对应token数量，文本token折算类似文本大模型token概念，由于不同模型采用的分词策略不同，同一段文本可能会被转化为不同数量的 token；\n\n   * 输出\\-音频token：输出音频折算token，1秒大致对应25个token；\n\n   * 每次请求不同类别准确的 token 用量，以账单计量的token数量为准；\n\n   * 资源包抵扣：音频token按照1:1比例抵扣，文本token按照1token折算1.2token比例抵扣；\n\n   * QPM\u002FTPM限制：当前对模型设置了 QPM（Queries Per Minute，每分钟请求数）及 TPM（Tokens Per Minute，每分钟 token 数量）的调用限制，QPM限制为60，TPM限制为100000。\n\n* **豆包同声传译大模型按服务用量token计费，该模型token的概念：** \n\n   * 音频和 token 数折算逻辑：输入每1秒的音频大致对应6.25个Token，输出音频每1秒大致对应25个token；\n\n   * 输出\\-文本token：输入文本字符数对应token数量，文本token折算类似文本大模型token概念，由于不同模型采用的分词策略不同，同一段文本可能会被转化为不同数量的 token；\n\n   * 每次请求不同类别准确的 token 用量，以账单计量的token数量为准；\n\n   * 资源包抵扣：输入token&输出\\-文本token按照1:1比例抵扣，输出\\-音频token按照1token折算3.75token 的调用不计入次数。\n\n* 语音合成实际计费时按次计费，一次送入文本不超过1024字节，对应UTF8约300个汉字；\n\n* 一句话识别实际计费时按次计费，单次送入音频时长不超过60秒。\n\n* 语音识别相关能力，双声道计费模式，按单声道计费，即**音频时长**进行计费。\n\n* **豆包语音妙记模型计费说明：** \n\n   * 妙记\\-音频文件识别是必选功能，不支持单独售卖，必须选择音频结构中的至少一项能力，计费项可以选择音频结构\\-单功能，或者音频结构\\-集合；\n\n   * 音频结构\\-单功能和者音频结构\\-集合二选一：\n\n      * 如果选择音频结构\\-单功能，可按照需要的功能数量灵活选择，按照选择的能力进行叠加计费，比如选择了全文总结+章节总结，则10小时音频的费用=10小时\\*1.8元+0.11元\\*2\\*10小时=20.2元；\n\n      * 如果选择音频结构\\-集合，则全部的音频结构能力都可以使用，10小时音频的费用=10小时\\*1.8元+0.5元\\*10小时=23元；\n\n\n\u003Cspan id=\"OyvXlSzH\"\u003E\u003C\u002Fspan\u003E\n## 其他费用\n\n**音色\u002F模型费用**\n\n\n|商品服务 |计费项 |数量阶梯 |单价 |\n|---|---|---|---|\n|语音合成 |付费精品音库 |不限 |1000元\u002F音色\u002F月 |\n\n\n说明：语音合成赠送多款火山引擎语音合成精品音色，实际赠送音色以语音合成控制台为准；\n\n&nbsp;\n\n**附加产品费用（并发\u002FQPS 增购包）** \n\n如需在免费额度之外进一步提升服务的并发或 QPS，可选择购买语音识别产品 QPS 或并发叠加包，计费标准如下：\n\n\n|商品服务 |计费项 |单价（元\u002F并发\u002F月或元\u002FQPS\u002F月） |说明（默认并发\u002FQPS数量以控制台为准） |\n|---|---|---|---|\n|大模型语音合成 |并发 |100 |正式版默认支持10并发，超出部分按需增购 |\n|大模型声音复刻 |并发 |100 |正式版默认支持10并发，超出部分按需增购 |\n|大模型流式语音识别 |并发 |100 |正式版默认支持10并发，超出部分按需增购 |\n|大模型录音文件识别（极速版） |并发 |400 |正式版默认支持5并发，超出部分按需增购 |\n|语音合成 |并发 |100 |正式版默认支持100并发，超出部分按需增购 |\n|流式语音识别 |并发 |100 |正式版默认支持10并发，超出部分按需增购 |\n|一句话识别 |并发 |100 |正式版默认支持10并发，超出部分按需增购 |\n|音视频字幕生成 |QPS |2000 |正式版默认支持5QPS，超出部分按需增购 |\n|自动字幕打轴 |QPS |2000 |正式版默认支持5QPS，超出部分按需增购 |\n\n\n特殊商务模式：\n\n\n* **大模型语音合成\\-并发版：** 支持按照纯并发计费模式，该模式只需购买并发，不再收取字符调用费用。无默认支持并发，购买并发单价2000元\u002F并发\u002F月；\n\n* **大模型声音复刻\\-并发版：** 支持按照纯并发计费模式，该模式只需购买并发，不再收取字符调用费用，音色费正常计费。无默认支持并发，购买并发单价2000元\u002F并发\u002F月；\n\n* **大模型流式语音识别\\-并发版：** 按照纯并发计费模式，该模式只需购买并发，不再收取按小时调用费用。无默认支持并发，购买并发单价1500元\u002F并发\u002F月。\n\n\n&nbsp;\n\n说明：\n\n\n* 大模型录音文件识别（含闲时版）、录音文件识别默认最大支持20QPS，半小时内提交的音频时长不超过500小时。豆包语音妙记模型默认最大支持3QPS。精品长文本语音合成默认最大支持10QPS。默认容量一般无需扩容，如需扩容可以[立即咨询](https:\u002F\u002Fwww.volcengine.com\u002Fcontact\u002Fproduct?t=%E8%AF%AD%E9%9F%B3%E8%AF%86%E5%88%AB&source=%E4%BA%A7%E5%93%81%E5%92%A8%E8%AF%A2)我们；\n\n* 并发定义：同一时刻请求服务的数量，是某一个时刻后端服务同时处理的请求数，计数周期为点。举例，您新建一个语音合成请求，服务端在持续进行合成处理或音频流返回，此时并发是1；在该请求处理的同时，又新建了一个请求发送文本数据，这时服务端同时处理该应用的2个请求，并发数就变为2；\n\n* QPS定义：QPS (query per second) 是一秒内查询服务接口的次数。\n\n","PDFURL":"https:\u002F\u002Feps-common-private-online.tos-cn-beijing.volces.com\u002Fcloud-doc\u002Feps-doc-center-pdf\u002F%E8%B1%86%E5%8C%85%E8%AF%AD%E9%9F%B3_%E8%AE%A1%E8%B4%B9%E8%AF%B4%E6%98%8E_1790679389.pdf","ParentCode":"product-billing-10","ParentID":1359368,"RedirectInfo":null,"ReuseDocumentVersionList":[],"SecondNav":null,"SeoConfig":{"Description":"","Keywords":"豆包语音","Title":""},"SourceVersionID":"16017481496576","Status":2,"Title":"计费说明","Type":0,"UpdatedTime":"2026-09-29T10:56:11Z"},"nodeMap":null,"docListMap":null,"docFold":"","feedbackShow":false,"feedbackType":"unknow","feedbackContent":"","tagIDs":""}},"errors":null}</script><script defer="defer" src="//res.gcloudcache.com/volc-fe/common-lib/static/js/index.1.0.0.39.js" crossorigin="anonymous"></script><script defer="defer" src="https://res.gcloudcache.com/volc-fe/doccenter/static/js/lib-arco.aab283dc.js" crossorigin="anonymous"></script><script defer="defer" src="https://res.gcloudcache.com/volc-fe/doccenter/static/js/lib-polyfill.c0f5af07.js" crossorigin="anonymous"></script><script defer="defer" src="https://res.gcloudcache.com/volc-fe/doccenter/static/js/lib-axios.3841fbd3.js" crossorigin="anonymous"></script><script defer="defer" src="https://res.gcloudcache.com/volc-fe/doccenter/static/js/lib-router.32b32c03.js" crossorigin="anonymous"></script><script defer="defer" src="https://res.gcloudcache.com/volc-fe/doccenter/static/js/4879.0d87a440.js" crossorigin="anonymous"></script><script defer="defer" src="https://res.gcloudcache.com/volc-fe/doccenter/static/js/main.39a322ef.js" crossorigin="anonymous"></script><script>!function(e){function n(){window.Slardar&&window.Slardar("sendEvent",{name:"ssr_level",categories:{site:e.site,level:String((window._SSR_DATA||{}).renderLevel)}})}window.Slardar?n():window.addEventListener("load",n,{once:!0})}({site:"doccenter"})</script></body></html>
